<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 640" preserveAspectRatio="xMidYMid slice" role="img" aria-labelledby="heroTitle">
  <title id="heroTitle">Oficina moderna con luz natural</title>
  <defs>
    <linearGradient id="wallGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdf8f0"/>
      <stop offset="0.55" stop-color="#f6ede0"/>
      <stop offset="1" stop-color="#eee2d0"/>
    </linearGradient>
    <linearGradient id="windowGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8e6"/>
      <stop offset="0.6" stop-color="#ffe9b8"/>
      <stop offset="1" stop-color="#ffd98a"/>
    </linearGradient>
    <linearGradient id="floorGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e7d8c2"/>
      <stop offset="1" stop-color="#d9c6a8"/>
    </linearGradient>
    <linearGradient id="deskGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9c7a53"/>
      <stop offset="1" stop-color="#7a5c3c"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4ade80"/>
      <stop offset="1" stop-color="#16a34a"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff4d6" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fff4d6" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="softer" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>

  <rect width="1600" height="640" fill="url(#wallGrad)"/>

  <!-- Floor -->
  <rect y="470" width="1600" height="170" fill="url(#floorGrad)"/>

  <!-- Soft sun glow -->
  <circle cx="1240" cy="80" r="280" fill="url(#sun)"/>

  <!-- Window bank, right side -->
  <g opacity="0.95">
    <rect x="1000" y="30" width="540" height="440" rx="10" fill="url(#windowGlow)"/>
    <rect x="1000" y="30" width="540" height="440" rx="10" fill="none" stroke="#e2c78f" stroke-width="10"/>
    <line x1="1180" y1="30" x2="1180" y2="470" stroke="#e2c78f" stroke-width="8"/>
    <line x1="1360" y1="30" x2="1360" y2="470" stroke="#e2c78f" stroke-width="8"/>
    <line x1="1000" y1="250" x2="1540" y2="250" stroke="#e2c78f" stroke-width="8"/>
  </g>

  <!-- Sunlight rays sweeping across the room -->
  <g filter="url(#soft)" opacity="0.55">
    <polygon points="1060,30 1200,30 780,640 560,640" fill="#fff6df"/>
    <polygon points="1320,30 1440,30 1140,640 940,640" fill="#fff6df"/>
  </g>

  <!-- Distant skyline through the window -->
  <g opacity="0.35">
    <rect x="1040" y="150" width="60" height="120" fill="#cfe8ff"/>
    <rect x="1120" y="110" width="50" height="160" fill="#cfe8ff"/>
    <rect x="1420" y="130" width="70" height="140" fill="#cfe8ff"/>
    <rect x="1490" y="160" width="45" height="110" fill="#cfe8ff"/>
  </g>

  <!-- Soft bokeh particles -->
  <g filter="url(#softer)" opacity="0.5">
    <circle cx="300" cy="120" r="55" fill="#ffe9b8"/>
    <circle cx="640" cy="80" r="36" fill="#ffe9b8"/>
    <circle cx="150" cy="280" r="46" fill="#bfe3ff"/>
  </g>

  <!-- Desk silhouette, blurred foreground for depth -->
  <g filter="url(#soft)" opacity="0.92">
    <rect x="60" y="450" width="640" height="24" rx="10" fill="url(#deskGrad)"/>
    <rect x="90" y="474" width="20" height="120" fill="#5c4530"/>
    <rect x="640" y="474" width="20" height="120" fill="#5c4530"/>

    <!-- laptop -->
    <rect x="190" y="378" width="170" height="12" rx="4" fill="#334155"/>
    <path d="M205 378 L215 296 L350 296 L360 378 Z" fill="#475569"/>
    <path d="M220 304 L342 304 L350 370 L212 370 Z" fill="#93c5fd"/>

    <!-- cup -->
    <rect x="410" y="404" width="34" height="42" rx="6" fill="#0f172a"/>
    <ellipse cx="427" cy="404" rx="17" ry="6" fill="#1e293b"/>

    <!-- plant -->
    <rect x="510" y="412" width="60" height="38" rx="8" fill="#cbd5e1"/>
    <path d="M540 412 C510 374, 480 356, 470 318 C510 328, 530 356, 540 376 Z" fill="url(#leafGrad)"/>
    <path d="M540 412 C570 370, 600 352, 615 314 C580 324, 555 352, 540 376 Z" fill="url(#leafGrad)"/>
    <path d="M540 412 C538 366, 538 338, 540 300 C550 338, 548 372, 546 404 Z" fill="#15803d"/>
  </g>

  <!-- Warm overlay to unify tones -->
  <rect width="1600" height="640" fill="#fdf2e0" opacity="0.06"/>
</svg>
